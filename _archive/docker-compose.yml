services:
  mongo:
    image: mongo:8.0
    container_name: moojidle-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./project/backend
    container_name: moojidle-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      DATA_BASE_URL: mongodb://mongo:27017/moojidle
    ports:
      - "3000:3000"
    command: npm run dev

  frontend:
    build:
      context: ./project/frontend
      target: runner
      args:
        VITE_API_BASE_URL: /api
    container_name: moojidle-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
