apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: moojidle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/jason9339/moojidle-k8s/frontend:main
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_BASE_URL
              value: http://localhost:3000
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: moojidle
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173
