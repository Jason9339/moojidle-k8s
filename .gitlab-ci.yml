stages:
  - test

variables:
  # MongoDB configuration
  NODE_ENV: test
  PORT: 3000 # Backend port

# Define conditions for automated and manual pipelines
.ci_conditions: &ci_conditions
  rules:
    - if: $CI_COMMIT_BRANCH == "ci-integration-testing"
      when: always
    
    # # Automatically run on commits to main branch
    # - if: $CI_COMMIT_BRANCH == "main"
    #   when: always
    #
    # # Manual execution for merge requests (except certain branches)
    # - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^fix-db/ && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^style-/
    #   when: manual
    #   allow_failure: false  # Pipeline succeeds even if this job is not run
    #
    # # Always allow manual triggering from web interface
    # - if: $CI_PIPELINE_SOURCE == "web"
    #   when: always
    

# Backend tests with MongoDB
backend-test:
  <<: *ci_conditions
  stage: test
  image: node:20.17.0
  
  before_script:
    - cd project/backend
    - npm ci 
  script:
    - npm run test
  artifacts:
    paths:
      - project/backend/test-reports/
    expire_in: 1 week

# Frontend tests (integration test)
frontend-test:
  <<: *ci_conditions
  stage: test
  image: node:20.17.0
  services:
    - name: mongo:8.0.8
      alias: mongo

  before_script:
    - cd project/frontend
    - npm ci
    - cd ../backend
    - npm ci
    - npm run test:server &
    - cd ../frontend
    - echo "VITE_API_BASE_URL=http://localhost:3000" > .env
  script:
    - npm run test:integration
  artifacts:
    paths:
      - project/frontend/coverage/
    expire_in: 1 week

# Cache node_modules to speed up builds
cache:
  paths:
    - project/backend/node_modules/
    - project/frontend/node_modules/
    - ~/.npm/

